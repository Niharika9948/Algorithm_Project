
<!DOCTYPE html>
<html>
<head>
    <title>SmartCart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>SmartCart 🛒</h1>
    <input id="search" placeholder="Search products">
    <h3>Cart: <span id="count">0</span></h3>
</header>

<h2>Our Products</h2>

<div class="buttons">
    <button onclick="sortProducts('asc')">Price Low to High</button>
    <button onclick="sortProducts('desc')">Price High to Low</button>
</div>

<p id="message">Select a sorting option</p>

<div id="products" class="products"></div>

<h2>Your Shopping Cart</h2>
<div id="cart"></div>
<h3 id="total">Total: ₹0</h3>

<script src="script.js"></script>
</body>
</html>
